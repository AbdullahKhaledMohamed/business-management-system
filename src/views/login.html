<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول | نظام إدارة الأعمال</title>

  <!-- Bootstrap 5 RTL -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
  />
  <!-- خط عربي واضح -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-wrapper d-flex align-items-center justify-content-center">
    <div class="card auth-card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="auth-logo mb-2">BMS</div>
          <h1 class="h4 fw-bold mb-1">نظام إدارة الأعمال</h1>
          <p class="text-muted mb-0">تسجيل الدخول للمتابعة إلى لوحة التحكم</p>
        </div>

        <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">اسم المستخدم</label>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              autocomplete="username"
              required
              minlength="3"
            />
            <div class="invalid-feedback">يرجى إدخال اسم مستخدم صحيح (3 أحرف على الأقل).</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">كلمة المرور</label>
            <div class="input-group">
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                autocomplete="current-password"
                required
                minlength="6"
              />
              <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                إظهار
              </button>
            </div>
            <div class="invalid-feedback">كلمة المرور يجب ألا تقل عن 6 أحرف.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2" id="submitBtn">
            <span id="submitText">تسجيل الدخول</span>
            <span id="submitSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          © <span id="year"></span> نظام إدارة الأعمال — جميع الحقوق محفوظة
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
