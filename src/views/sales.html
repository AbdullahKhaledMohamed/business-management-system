<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فواتير المبيعات | نظام إدارة الأعمال</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">BMS</div>
      <nav class="nav flex-column">
        <a class="nav-link" href="/dashboard.html" data-page="dashboard" data-roles="ADMIN,ACCOUNTANT">لوحة التحكم</a>
        <a class="nav-link" href="/products.html" data-page="products" data-roles="ADMIN,ACCOUNTANT,INVENTORY_MANAGER">المنتجات والأصناف</a>
        <a class="nav-link" href="/customers.html" data-page="customers" data-roles="ADMIN,ACCOUNTANT">العملاء</a>
        <a class="nav-link" href="/sales.html" data-page="sales" data-roles="ADMIN,ACCOUNTANT">فواتير المبيعات</a>
        <a class="nav-link" href="/expenses.html" data-page="expenses" data-roles="ADMIN,ACCOUNTANT">المصروفات</a>
        <a class="nav-link" href="/inventory.html" data-page="inventory" data-roles="ADMIN,INVENTORY_MANAGER">حركة المخزون</a>
      </nav>
    </aside>

    <div class="main-area">
      <nav class="topbar d-flex align-items-center justify-content-between">
        <span class="fw-bold">فواتير المبيعات</span>
        <div class="d-flex align-items-center gap-3">
          <span id="userLabel" class="text-white-50 small"></span>
          <button class="btn btn-sm btn-outline-light" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </nav>

      <main class="container-fluid p-4">
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-3">
                <label class="form-label">الحالة</label>
                <select id="statusFilter" class="form-select">
                  <option value="">كل الحالات</option>
                  <option value="CONFIRMED">مؤكدة</option>
                  <option value="PARTIALLY_PAID">مدفوعة جزئيًا</option>
                  <option value="PAID">مدفوعة بالكامل</option>
                  <option value="CANCELED">ملغاة</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">من تاريخ</label>
                <input type="date" id="dateFromFilter" class="form-control" />
              </div>
              <div class="col-md-3">
                <label class="form-label">إلى تاريخ</label>
                <input type="date" id="dateToFilter" class="form-control" />
              </div>
              <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-outline-secondary flex-fill" id="exportCsvBtn">تصدير CSV</button>
                <button class="btn btn-primary flex-fill" id="addSaleBtn">+ فاتورة جديدة</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr><th>رقم الفاتورة</th><th>العميل</th><th>الحالة</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>التاريخ</th><th></th></tr>
              </thead>
              <tbody id="salesTableBody"></tbody>
            </table>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center" id="salesPagination"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- ===== Create invoice modal ===== -->
  <div class="modal fade" id="saleModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <form id="saleForm">
          <div class="modal-header">
            <h5 class="modal-title">فاتورة مبيعات جديدة</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label">العميل</label>
                <select id="saleCustomerId" class="form-select" required></select>
              </div>
              <div class="col-md-3">
                <label class="form-label">خصم الفاتورة (مبلغ)</label>
                <input type="number" step="0.01" min="0" id="saleDiscount" class="form-control" value="0" />
              </div>
            </div>

            <table class="table table-sm align-middle" id="saleItemsTable">
              <thead class="table-light">
                <tr><th>المنتج</th><th style="width:110px">الكمية</th><th style="width:130px">السعر</th><th style="width:130px">خصم السطر</th><th style="width:130px">الإجمالي</th><th></th></tr>
              </thead>
              <tbody id="saleItemsBody"></tbody>
            </table>
            <button type="button" class="btn btn-sm btn-outline-primary" id="addItemRowBtn">+ إضافة صنف</button>

            <div class="d-flex justify-content-end mt-3">
              <table class="table table-sm w-auto">
                <tr><th class="pe-4">الإجمالي الفرعي</th><td id="saleSubtotalDisplay">0.00</td></tr>
                <tr><th class="pe-4">الخصم</th><td id="saleDiscountDisplay">0.00</td></tr>
                <tr class="fw-bold"><th class="pe-4">الإجمالي النهائي</th><td id="saleTotalDisplay">0.00</td></tr>
              </table>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ الفاتورة</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== Invoice detail / payment / cancel modal ===== -->
  <div class="modal fade" id="saleDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">تفاصيل الفاتورة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="saleDetailBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/sales.js"></script>
</body>
</html>
