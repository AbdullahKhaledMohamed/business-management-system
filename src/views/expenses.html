<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المصروفات | نظام إدارة الأعمال</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">BMS</div>
      <nav class="nav flex-column">
        <a class="nav-link" href="/dashboard.html" data-page="dashboard" data-roles="ADMIN,ACCOUNTANT">لوحة التحكم</a>
        <a class="nav-link" href="/products.html" data-page="products" data-roles="ADMIN,ACCOUNTANT,INVENTORY_MANAGER">المنتجات والأصناف</a>
        <a class="nav-link" href="/customers.html" data-page="customers" data-roles="ADMIN,ACCOUNTANT">العملاء</a>
        <a class="nav-link" href="/sales.html" data-page="sales" data-roles="ADMIN,ACCOUNTANT">فواتير المبيعات</a>
        <a class="nav-link" href="/expenses.html" data-page="expenses" data-roles="ADMIN,ACCOUNTANT">المصروفات</a>
        <a class="nav-link" href="/inventory.html" data-page="inventory" data-roles="ADMIN,INVENTORY_MANAGER">حركة المخزون</a>
      </nav>
    </aside>

    <div class="main-area">
      <nav class="topbar d-flex align-items-center justify-content-between">
        <span class="fw-bold">المصروفات</span>
        <div class="d-flex align-items-center gap-3">
          <span id="userLabel" class="text-white-50 small"></span>
          <button class="btn btn-sm btn-outline-light" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </nav>

      <main class="container-fluid p-4">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <div class="card kpi-card bg-danger"><div class="card-body"><div class="kpi-value" id="totalExpensesKpi">0.00</div><div class="kpi-label">إجمالي المصروفات (الفلتر الحالي)</div></div></div>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-3">
                <label class="form-label">التصنيف</label>
                <select id="categoryFilter" class="form-select"><option value="">كل التصنيفات</option></select>
              </div>
              <div class="col-md-3">
                <label class="form-label">بحث في الوصف</label>
                <input type="text" id="expenseSearch" class="form-control" />
              </div>
              <div class="col-md-2">
                <label class="form-label">من تاريخ</label>
                <input type="date" id="dateFromFilter" class="form-control" />
              </div>
              <div class="col-md-2">
                <label class="form-label">إلى تاريخ</label>
                <input type="date" id="dateToFilter" class="form-control" />
              </div>
              <div class="col-md-2 d-flex gap-2">
                <button class="btn btn-outline-secondary flex-fill" id="exportCsvBtn">CSV</button>
                <button class="btn btn-primary flex-fill" id="addExpenseBtn">+ مصروف</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light"><tr><th>التصنيف</th><th>الوصف</th><th>المبلغ</th><th>التاريخ</th><th></th></tr></thead>
              <tbody id="expensesTableBody"></tbody>
            </table>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center" id="expensesPagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="expenseForm">
          <div class="modal-header">
            <h5 class="modal-title" id="expenseModalTitle">مصروف جديد</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="expenseId" />
            <div class="mb-3">
              <label class="form-label">التصنيف</label>
              <input type="text" id="expenseCategory" class="form-control" list="expenseCategoryOptions" required />
              <datalist id="expenseCategoryOptions"></datalist>
            </div>
            <div class="mb-3">
              <label class="form-label">الوصف</label>
              <input type="text" id="expenseDescription" class="form-control" required />
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">المبلغ</label>
                <input type="number" step="0.01" min="0.01" id="expenseAmount" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">تاريخ المصروف</label>
                <input type="date" id="expenseDate" class="form-control" required />
              </div>
            </div>
            <div class="mb-3 mt-3">
              <label class="form-label">ملاحظات</label>
              <textarea id="expenseNotes" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/expenses.js"></script>
</body>
</html>
