<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العملاء | نظام إدارة الأعمال</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">BMS</div>
      <nav class="nav flex-column">
        <a class="nav-link" href="/dashboard.html" data-page="dashboard" data-roles="ADMIN,ACCOUNTANT">لوحة التحكم</a>
        <a class="nav-link" href="/products.html" data-page="products" data-roles="ADMIN,ACCOUNTANT,INVENTORY_MANAGER">المنتجات والأصناف</a>
        <a class="nav-link" href="/customers.html" data-page="customers" data-roles="ADMIN,ACCOUNTANT">العملاء</a>
        <a class="nav-link" href="/sales.html" data-page="sales" data-roles="ADMIN,ACCOUNTANT">فواتير المبيعات</a>
        <a class="nav-link" href="/expenses.html" data-page="expenses" data-roles="ADMIN,ACCOUNTANT">المصروفات</a>
        <a class="nav-link" href="/inventory.html" data-page="inventory" data-roles="ADMIN,INVENTORY_MANAGER">حركة المخزون</a>
      </nav>
    </aside>

    <div class="main-area">
      <nav class="topbar d-flex align-items-center justify-content-between">
        <span class="fw-bold">العملاء</span>
        <div class="d-flex align-items-center gap-3">
          <span id="userLabel" class="text-white-50 small"></span>
          <button class="btn btn-sm btn-outline-light" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </nav>

      <main class="container-fluid p-4">
        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <div class="col-md-8">
                <label class="form-label">بحث (الاسم / الهاتف / البريد)</label>
                <input type="text" id="customerSearch" class="form-control" placeholder="اكتب للبحث..." />
              </div>
              <div class="col-md-4 text-end">
                <button class="btn btn-primary w-100" id="addCustomerBtn">+ عميل جديد</button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
              <thead class="table-light">
                <tr><th>الاسم</th><th>الهاتف</th><th>البريد الإلكتروني</th><th>الرصيد المستحق</th><th></th></tr>
              </thead>
              <tbody id="customersTableBody"></tbody>
            </table>
          </div>
          <div class="card-footer d-flex justify-content-between align-items-center" id="customersPagination"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="customerForm">
          <div class="modal-header">
            <h5 class="modal-title" id="customerModalTitle">عميل جديد</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="customerId" />
            <div class="mb-3">
              <label class="form-label">الاسم</label>
              <input type="text" id="customerName" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">الهاتف</label>
              <input type="text" id="customerPhone" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">البريد الإلكتروني</label>
              <input type="email" id="customerEmail" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">العنوان</label>
              <textarea id="customerAddress" class="form-control" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/customers.js"></script>
</body>
</html>
